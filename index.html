<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>爸媽照護帳本</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --ink:#1f2933; --sub:#66788a; --line:#e3e8ee;
  --pri:#2f6fdf; --pri-soft:#e7efff; --ok:#1e9e62; --ok-soft:#e3f6ec;
  --warn:#d9822b; --warn-soft:#fdf0e1; --bad:#d64545; --bad-soft:#fdeaea; --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:16px;line-height:1.45}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--pri-soft);object-fit:cover;
  display:inline-flex;align-items:center;justify-content:center;font-size:14px;color:var(--pri);flex:none}
main{padding:12px 12px 100px;max-width:640px;margin:0 auto}
.demo{background:#fff7d6;border:1px solid #f0d77a;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:14px}
.demo select{padding:2px 6px;border-radius:6px;border:1px solid #d8c26a;background:#fff}

.seg{display:flex;background:#e6eaef;border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 0;font-size:15px;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.monthbar{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.monthbar .m{flex:1;text-align:center;font-weight:600;font-size:17px}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;width:40px;height:38px;font-size:18px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:14px;color:var(--sub)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.total{background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline}
.total b{font-size:24px}
.total small{color:var(--sub)}

.dayhead{font-size:13px;color:var(--sub);margin:14px 4px 6px;display:flex;justify-content:space-between}
.rec{background:var(--card);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;border:1px solid transparent}
.rec.mine{border-left:4px solid var(--pri)}
.rec .body{flex:1;min-width:0}
.rec .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .meta{font-size:13px;color:var(--sub);margin-top:2px}
.rec .note{font-size:13px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .amt{font-weight:700;font-size:17px;white-space:nowrap;text-align:right}
.amt.in{color:var(--ok)} .amt.out{color:var(--bad)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--pri-soft);color:var(--pri);margin-right:4px}
.tag.mom{background:#fbe9f3;color:#b0407a}.tag.both{background:#efeaf9;color:#6b4fbb}
.tag.src{background:var(--ok-soft);color:var(--ok)}
.st{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;margin-top:4px}
.st-待對帳{background:var(--warn-soft);color:var(--warn)}
.st-部分結清{background:#eef0ff;color:#5a5fd6}
.st-已結清{background:var(--ok-soft);color:var(--ok)}
.empty{text-align:center;color:var(--sub);padding:40px 0}

nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;color:var(--sub);font-size:12px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .i{font-size:20px;line-height:1}
nav button.on{color:var(--pri);font-weight:600}
nav .add{flex:none;width:64px;height:64px;margin-top:-24px;border-radius:50%;background:var(--pri);color:#fff;font-size:30px;
  box-shadow:0 6px 16px rgba(47,111,223,.35);justify-content:center}

.mask{position:fixed;inset:0;background:rgba(15,23,32,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h2{font-size:18px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.sheet h2 button{border:0;background:none;font-size:22px;color:var(--sub)}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.field textarea{min-height:64px;resize:vertical}
.amount-input{font-size:26px!important;font-weight:700}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.catgrid.c3{grid-template-columns:repeat(3,1fr)}
.catgrid button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 0;font-size:14px}
.catgrid button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:600;background:var(--pri);color:#fff}
.btn.ghost{background:var(--pri-soft);color:var(--pri)}
.btn.green{background:var(--ok)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{opacity:.45}
.row2{display:flex;gap:8px}
.row2>*{flex:1}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;gap:12px}
.kv span:first-child{color:var(--sub);flex:none}
.kv span:last-child{text-align:right;word-break:break-word}
.receipt-img{width:100%;border-radius:10px;margin-top:10px;border:1px solid var(--line)}
.preview{max-height:160px;border-radius:8px;margin-top:6px;display:block}
.hint{font-size:13px;color:var(--sub);margin:6px 0}

.card{background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
.card h3{font-size:16px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.card.warn{background:var(--warn-soft)} .card.warn .hint{color:#8a5a1d}
.card.fund{background:linear-gradient(135deg,#1f5fcf,#3f86f0);color:#fff}
.card.fund .sub{opacity:.85;font-size:13px}
.card.fund .bal{font-size:32px;font-weight:700;margin:2px 0 8px}
.card.fund .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:13px}
.card.fund .grid b{display:block;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 3px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--sub);font-weight:500}
.pos{color:var(--ok);font-weight:600}.neg{color:var(--bad);font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--pri);margin-top:3px}
.catrow{margin-bottom:9px;font-size:14px}
.catrow .l{display:flex;justify-content:space-between}
.transfer{background:var(--pri-soft);border-radius:10px;padding:10px 12px;margin-bottom:6px;font-size:15px;display:flex;justify-content:space-between}
.transfer.fundt{background:var(--ok-soft)}
.mem{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.mem .n{flex:1;min-width:0}
.mem .n small{display:block;color:var(--sub);font-size:12px}
.mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;font-size:13px;margin-left:4px}
.mini.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.badge{font-size:11px;padding:1px 6px;border-radius:6px;background:#eee;color:#555;margin-left:4px}
.mode{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.mode.on{border-color:var(--pri);background:var(--pri-soft)}
.mode input{margin-top:4px;width:18px;height:18px;flex:none}
.mode b{display:block}
.mode small{color:var(--sub);font-size:13px}
.hist{border-bottom:1px solid var(--line);padding:10px 0}
.hist .h{display:flex;justify-content:space-between;align-items:center}
.hist small{color:var(--sub)}
.center{text-align:center;padding:60px 20px}
.center .big{font-size:48px}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);background:rgba(20,28,36,.92);color:#fff;
  padding:10px 18px;border-radius:999px;font-size:14px;z-index:50;max-width:86%;text-align:center}
.spinner{width:28px;height:28px;border:3px solid var(--pri-soft);border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.bookbar{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-radius:12px;padding:10px 14px;margin-bottom:10px;
  background:#e7efff;color:#1f3f8f;font-size:15px;text-align:left}
.bookbar.mom{background:#fbe9f3;color:#8a2d5d}
.bookbar .sw{font-size:13px;opacity:.8}
.bookpick{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;margin-bottom:8px}
.bookpick.on{border-color:var(--pri);background:var(--pri-soft)}
.bookpick small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.catgrid.c2{grid-template-columns:repeat(2,1fr)}
.catgrid.c2 button{font-size:13px;padding:9px 4px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;margin:4px 0 14px;color:var(--ink)}
.check input{width:20px;height:20px}
.rec.flat{padding:10px 4px;margin:0;border-radius:0;border-bottom:1px solid var(--line)}
.transfer.claim{background:#f3eefb}
.tag.dad{background:#e8f1ec;color:#2b7a55}
.badge.lockb{background:#fff1d6;color:#9a6a12}
.card.fund.dad{background:linear-gradient(135deg,#2b7a55,#3fa877)}
nav .add.off{background:#b9c3d0;box-shadow:none}
.inp{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px}
#busy{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,0);cursor:wait;touch-action:none}
#busy.hidden{display:none}
#busy .spin,#busy .busytxt{opacity:0;animation:busyin .2s .35s forwards}
#busy .spin{width:34px;height:34px;border:4px solid #ddd;border-top-color:#06c755;border-radius:50%;animation:busyin .2s .35s forwards,busyspin .8s linear infinite}
#busy .busytxt{margin-top:10px;font-size:14px;color:#555;background:rgba(255,255,255,.9);padding:4px 12px;border-radius:12px}
@keyframes busyin{to{opacity:1}} @keyframes busyspin{to{transform:rotate(360deg)}}
</style>
<style>
.bookbar{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:var(--radius);padding:10px 14px;margin-bottom:10px;border:1px solid var(--line)}
.bookbar .bn{flex:1;font-weight:700;font-size:16px}

.closedbar{background:#eceff3;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:14px;color:#4a5866}

.bookitem{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:10px}

</style>

<body>
<header>
  <h1>💙 爸媽照護帳本</h1>
  <span id="whoName" style="font-size:14px;color:var(--sub)"></span>
  <span id="whoAvatar"></span>
</header>

<main id="main">
  <div class="center"><div class="spinner"></div><p class="hint">載入中…</p></div>
</main>

<nav id="nav" class="hidden">
  <button data-tab="list" class="on"><span class="i">📋</span>明細</button>
  <button data-tab="settle"><span class="i">⚖️</span>結算</button>
  <button class="add" id="addBtn" aria-label="記一筆">＋</button>
  <button data-tab="fund"><span class="i">🏦</span>專戶</button>
  <button data-tab="members"><span class="i">👨‍👩‍👧</span>成員</button>
</nav>

<div id="modal"></div>
<div id="busy" class="hidden"><div class="spin"></div><div class="busytxt">處理中，請稍候…</div></div>
<div id="toast" class="toast hidden"></div>

<script>
/* ═══════════ 設定：部署後填入這兩個值 ═══════════ */
const CONFIG = {
  LIFF_ID: '2012321718-by9bc1DH',   // 例：2001234567-AbCdEfGh
  GAS_URL: 'https://script.google.com/macros/s/AKfycbxy66BGtciH5Fq1i7y0oNwLmKoqj9jsagS1egWkVa7QXYVR_MqN8SXdBQWLiVxOAmZ3/exec'    // 例：https://script.google.com/macros/s/XXXX/exec
};
/* 兩個值都留空 → 「預覽模式」，資料只存在這個頁面裡，可先試用 */

/* ═══════ 結算核心（前後端共用同一份邏輯） ═══════ */
var SETTLE_MODES = {
  equal:     { name: '各家均分',               desc: '每個參與分攤的家庭平均負擔，不動用專戶。' },
  ratio:     { name: '依比例分攤',             desc: '依各家設定的比例負擔（例如 1:1），不動用專戶。' },
  fund:      { name: '專戶全額支付',           desc: '家人墊付的款項全部由專戶撥還。專戶不夠時無法結算，需先存入。' },
  fundFirst: { name: '專戶優先，不足依比例分攤', desc: '先用專戶撥還，專戶不夠的部分再依各家比例分攤。' },
  fundCap:   { name: '專戶每期上限',           desc: '專戶每期最多負擔設定金額（含專戶直接付款），超過的部分依各家比例分攤。' },
  estate:    { name: '不足列為遺產清償',       desc: '先用專戶撥還，不夠的部分列為「待遺產分割時清償」，家人先不分攤。' }
};
var FUND_SOURCES = ['農保喪葬津貼', '遺產分配', '家人出資', '媽媽收入', '政府補助', '上一本結餘',
  '銀行存款', '股票', '基金', '不動產', '保險理賠', '其他'];
var FUND_ID = 'FUND';     // 由本帳專戶直接付款
var ESTATE_ID = 'ESTATE'; // 由爸爸帳戶（遺產）直接付款，不經專戶

/** 專戶餘額。「領取」是家人直接從爸爸帳戶拿的錢，不經過專戶，所以不影響餘額 */
function computeFundSummary(fundEntries, records) {
  var s = { deposits: 0, returned: 0, payouts: 0, transferredOut: 0, direct: 0, received: 0, balance: 0, bySource: {} };
  fundEntries.forEach(function (f) {
    var a = Number(f.amount) || 0;
    if (f.type === '存入') { s.deposits += a; s.bySource[f.source || '其他'] = (s.bySource[f.source || '其他'] || 0) + a; }
    else if (f.type === '退回') s.returned += a;
    else if (f.type === '撥付') s.payouts += a;
    else if (f.type === '轉出') s.transferredOut += a;
    else if (f.type === '領取') s.received += a;
  });
  records.forEach(function (r) { if (r.payerId === FUND_ID) s.direct += Number(r.amount) || 0; });
  s.balance = s.deposits + s.returned - s.payouts - s.transferredOut - s.direct;
  return s;
}

function groupOf_(m) { return (m && String(m.group || '').trim()) || (m ? m.name : '?'); }

/**
 * inp: { records:[{id,amount,payerId}], receipts:[{id,memberId,amount}], members:[{userId,name,group}],
 *        groupWeights:{家庭:比例}, mode, cap, fundAvailable }
 */
function computeSettlement(inp) {
  var mode = SETTLE_MODES[inp.mode] ? inp.mode : 'equal';
  var mem = {}, warnings = [];
  inp.members.forEach(function (m) { mem[m.userId] = m; });
  var paid = {}, recv = {}, fundDirect = 0, estateDirect = 0, P = 0;
  var included = [], unknown = [], receiptIds = [];
  inp.records.forEach(function (r) {
    var a = Number(r.amount) || 0;
    if (r.payerId === FUND_ID) { fundDirect += a; included.push(r.id); }
    else if (r.payerId === ESTATE_ID) { estateDirect += a; included.push(r.id); }
    else if (r.payerId && mem[r.payerId]) { paid[r.payerId] = (paid[r.payerId] || 0) + a; P += a; included.push(r.id); }
    else unknown.push(r.id);
  });
  (inp.receipts || []).forEach(function (f) {
    if (mem[f.memberId]) { recv[f.memberId] = (recv[f.memberId] || 0) + (Number(f.amount) || 0); receiptIds.push(f.id); }
  });

  // 每位成員：墊付 − 已領取。領取多於墊付的部分要退回專戶
  var ids = {};
  Object.keys(paid).forEach(function (k) { ids[k] = 1; });
  Object.keys(recv).forEach(function (k) { ids[k] = 1; });
  var people = Object.keys(ids).map(function (id) {
    var p = paid[id] || 0, r = recv[id] || 0;
    return { id: id, name: mem[id].name, group: groupOf_(mem[id]), paid: p, recv: r,
      adv: Math.max(0, p - r), hold: Math.max(0, r - p), reimbF: 0, reimb: 0 };
  });
  var returns = people.filter(function (x) { return Math.round(x.hold) > 0; })
    .map(function (x) { return { id: x.id, name: x.name, amount: Math.round(x.hold) }; });
  var H = returns.reduce(function (s, x) { return s + x.amount; }, 0);
  var A = people.reduce(function (s, x) { return s + x.adv; }, 0);

  var avail = Math.max(0, Number(inp.fundAvailable) || 0) + H;
  if ((Number(inp.fundAvailable) || 0) < 0) warnings.push('專戶餘額是負數，請先登記存入');
  var capacity = 0;
  if (mode === 'fund' || mode === 'fundFirst' || mode === 'estate') capacity = avail;
  else if (mode === 'fundCap') capacity = Math.max(0, Math.min(avail, (Number(inp.cap) || 0) - fundDirect));
  var R = Math.min(capacity, A);
  var shortfall = mode === 'fund' ? Math.max(0, A - R) : 0;
  if (shortfall > 0.5) warnings.push('專戶不足 ' + Math.round(shortfall) + ' 元，需先存入才能結算（或改用「專戶優先，不足依比例分攤」）');
  var S = (mode === 'fund' || mode === 'estate') ? 0 : A - R;

  // 家庭（分攤單位）
  var gw = inp.groupWeights || {}, groups = {};
  inp.members.forEach(function (m) {
    var g = groupOf_(m);
    if (!groups[g]) groups[g] = { group: g, members: [], w: 0, adv: 0, paid: 0, recv: 0, share: 0, reimb: 0, net: 0 };
    if (groups[g].members.indexOf(m.name) < 0) groups[g].members.push(m.name);
  });
  Object.keys(groups).forEach(function (g) {
    var w = Number(gw[g]) || 0;
    groups[g].w = mode === 'equal' ? (w > 0 ? 1 : 0) : w;
  });
  var W = Object.keys(groups).reduce(function (s, g) { return s + groups[g].w; }, 0);
  if (S > 0.5 && W === 0) warnings.push('沒有設定參與分攤的家庭比例，請到「成員」頁設定');
  people.forEach(function (x) { var g = groups[x.group]; g.adv += x.adv; g.paid += x.paid; g.recv += x.recv; });
  Object.keys(groups).forEach(function (k) { var g = groups[k]; g.share = W > 0 ? S * g.w / W : 0; });

  // 專戶撥還：優先給「多付」的家庭，家庭內再依各人墊付比例分配
  var pos = 0;
  Object.keys(groups).forEach(function (k) { var g = groups[k]; g.excess = g.adv - g.share; if (g.excess > 0) pos += g.excess; });
  if (R > 0 && pos > 0) {
    people.forEach(function (x) {
      var g = groups[x.group];
      x.reimbF = (g.excess > 0 && g.adv > 0) ? R * (g.excess / pos) * (x.adv / g.adv) : 0;
    });
    var target = Math.round(R), acc = 0;
    people.forEach(function (x) { x.reimb = Math.floor(x.reimbF); acc += x.reimb; });
    var order = people.slice().sort(function (a, b) { return (b.reimbF - b.reimb) - (a.reimbF - a.reimb); });
    for (var i = 0; acc < target && i < order.length; i++) { if (order[i].reimbF > 0) { order[i].reimb++; acc++; } }
  }
  people.forEach(function (x) { groups[x.group].reimb += x.reimb; });
  var groupRows = Object.keys(groups).map(function (k) {
    var g = groups[k]; g.net = g.adv - g.reimb - g.share;
    return { group: g.group, members: g.members, weight: g.w, paid: g.paid, recv: g.recv, adv: g.adv,
      reimb: g.reimb, share: g.share, net: g.net };
  }).filter(function (g) { return g.paid || g.recv || g.weight; });

  var transfers = [], estateClaims = [];
  if (mode === 'estate') {
    estateClaims = people.map(function (x) { return { id: x.id, name: x.name, amount: Math.round(x.adv - x.reimb) }; })
      .filter(function (c) { return c.amount > 0; });
  } else {
    var cred = groupRows.filter(function (g) { return g.net > 0.5; }).map(function (g) { return { name: g.group, v: g.net }; });
    var debt = groupRows.filter(function (g) { return g.net < -0.5; }).map(function (g) { return { name: g.group, v: -g.net }; });
    cred.sort(function (a, b) { return b.v - a.v; }); debt.sort(function (a, b) { return b.v - a.v; });
    var a = 0, b = 0;
    while (a < debt.length && b < cred.length) {
      var x = Math.min(debt[a].v, cred[b].v);
      if (Math.round(x) > 0) transfers.push({ from: debt[a].name, to: cred[b].name, amount: Math.round(x) });
      debt[a].v -= x; cred[b].v -= x;
      if (debt[a].v < 0.5) a++;
      if (cred[b].v < 0.5) b++;
    }
  }
  if (unknown.length) warnings.push(unknown.length + ' 筆沒有填付款人，這次不會結算');
  var reimburse = people.filter(function (x) { return x.reimb > 0; })
    .map(function (x) { return { id: x.id, name: x.name, amount: x.reimb }; });
  return {
    mode: mode, modeName: SETTLE_MODES[mode].name,
    total: fundDirect + estateDirect + P, fundDirect: fundDirect, estateDirect: estateDirect, memberPaid: P,
    received: people.reduce(function (s, x) { return s + x.recv; }, 0),
    fundReimburse: Math.round(R), fundTotal: fundDirect + Math.round(R), familyShare: Math.round(S),
    estateClaimTotal: estateClaims.reduce(function (s, c) { return s + c.amount; }, 0),
    people: people.map(function (x) { return { id: x.id, name: x.name, group: x.group, paid: x.paid, recv: x.recv, reimb: x.reimb }; }),
    groupRows: groupRows, reimburse: reimburse, returns: returns, transfers: transfers, estateClaims: estateClaims,
    includedIds: included, receiptIds: receiptIds, unknownIds: unknown,
    blocked: shortfall > 0.5 || (S > 0.5 && W === 0), warnings: warnings
  };
}

/** 出資平衡：各家實際出資（家人出資存入＋歷次結算分攤）與約定比例的差距 */
function computeContribution(fundEntries, settlements, members, groupWeights) {
  var byId = {}, c = {};
  members.forEach(function (m) { byId[m.userId] = m; });
  fundEntries.forEach(function (f) {
    if (f.type === '存入' && f.source === '家人出資' && byId[f.memberId]) {
      var g = groupOf_(byId[f.memberId]); c[g] = (c[g] || 0) + (Number(f.amount) || 0);
    }
  });
  settlements.forEach(function (s) {
    if (s.state !== '有效') return;
    (s.groupRows || []).forEach(function (g) { if (g.share) c[g.group] = (c[g.group] || 0) + g.share; });
  });
  var gw = groupWeights || {}, W = 0;
  Object.keys(gw).forEach(function (g) { W += Number(gw[g]) || 0; });
  var total = Object.keys(c).reduce(function (s, g) { return s + c[g]; }, 0);
  var rows = Object.keys(gw).filter(function (g) { return Number(gw[g]) > 0; }).map(function (g) {
    var target = W ? total * gw[g] / W : 0;
    return { group: g, weight: Number(gw[g]), contributed: c[g] || 0, target: target, diff: (c[g] || 0) - target };
  });
  return { total: total, rows: rows };
}

const READ_ACTIONS={me:1,list:1,receipt:1,preview:1};
const _inflight=new Set(), _reqIds={};
let _busyN=0;
function busy(on){ _busyN=Math.max(0,_busyN+(on?1:-1)); $('#busy').classList.toggle('hidden', _busyN===0); }
function newReqId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,10); }
async function api(action, payload={}, opts={}){
  if(READ_ACTIONS[action]){ api._fresh=null; return apiRaw(action, payload); }
  // 寫入動作：同樣內容正在送出時，忽略重複點擊；整個畫面鎖住直到完成
  const key=action+'|'+JSON.stringify(payload);
  if(_inflight.has(key)) return new Promise(()=>{});
  _inflight.add(key); if(!opts.quiet) busy(true);
  const reqId=_reqIds[key]||(_reqIds[key]=newReqId());
  try{
    const r=await apiRaw(action, payload, reqId);
    delete _reqIds[key]; return r;
  }catch(e){
    if(e.code!=='NETWORK') delete _reqIds[key];   // 網路中斷時保留編號，重試不會變兩筆
    throw e;
  }finally{ _inflight.delete(key); if(!opts.quiet) busy(false); }
}
async function apiRaw(action, payload={}, reqId){
  if(DEMO) return demoApi(action, payload);
  const token = liff.getAccessToken();
  let res, text, j;
  try{ res = await fetch(CONFIG.GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({action, token, reqId}, payload)) }); }
  catch(e){ const x=new Error('連不到後端（Apps Script）。請確認 GAS_URL 正確、手機網路正常。'); x.code='NETWORK'; throw x; }
  text = await res.text();
  try{ j = JSON.parse(text); }
  catch(e){ const x=new Error('後端回傳的不是帳本資料。通常是 Apps Script 部署時「誰可以存取」沒有選「任何人」，或 GAS_URL 不是以 /exec 結尾的網址。'); x.code='NOT_JSON'; throw x; }
  if(!j.ok){
    // 只在「登入過期」時自動重新登入一次，避免無限循環
    if(j.code==='AUTH_EXPIRED' && !reloginTriedRecently()){
      markRelogin(); liff.logout(); liff.login({redirectUri: location.href.split('#')[0]});
      const x=new Error('登入已過期，重新登入中…'); x.code='RELOGIN'; throw x;
    }
    const e=new Error(j.message); e.code=j.code; throw e;
  }
  try{ sessionStorage.removeItem('cl_relogin'); }catch(e){}
  api._fresh = j.state || null;   // 寫入後後端直接帶回最新資料，省一次往返
  return j.data;
}
function reloginTriedRecently(){ try{ const t=Number(sessionStorage.getItem('cl_relogin')||0); return Date.now()-t < 120000; }catch(e){ return true; } }
function markRelogin(){ try{ sessionStorage.setItem('cl_relogin', String(Date.now())); }catch(e){} }

async function diagnose(){
  const rows=[], add=(k,v,good)=>rows.push(`<div class="kv"><span>${good===false?'❌':good?'✅':'・'} ${esc(k)}</span><span>${esc(v)}</span></div>`);

  const liffOk = typeof liff!=='undefined';
  add('LINE SDK', liffOk?'已載入':'載入失敗', liffOk);
  if(liffOk){
    let inClient='?', logged='?', tok=false, ctx='';
    try{ inClient = liff.isInClient()?'是（在 LINE 裡開啟）':'否（外部瀏覽器）'; }catch(e){}
    try{ logged = liff.isLoggedIn()?'是':'否'; tok=!!liff.getAccessToken(); }catch(e){ logged='尚未初始化'; }
    try{ const c=liff.getContext(); ctx=c?c.type:''; }catch(e){}
    add('在 LINE App 裡', inClient);
    add('已登入 LINE', logged, logged==='是');
    add('取得登入權杖', tok?'有':'沒有', tok);
    if(ctx) add('開啟位置', ctx);
    try{ const id=liff.id || ''; if(id) add('LIFF 實際 ID', id, id===CONFIG.LIFF_ID); }catch(e){}
  }
  if(CONFIG.GAS_URL){
    try{ const r=await fetch(CONFIG.GAS_URL); const t=await r.text(); let j=null; try{ j=JSON.parse(t); }catch(e){}
      if(j && j.app==='care-ledger'){ add('後端連線', '正常（v'+j.version+'）', true); if(j.channelIdSet===false) add('LINE_CHANNEL_ID', '後端還沒設定', false); }
      else add('後端連線', '回應不是帳本後端（檢查部署權限「任何人」與 /exec 網址）', false);
    }catch(e){ add('後端連線', '連不到', false); }
  }
  add('網頁網址', location.origin + location.pathname);
  return rows.join('');
}

function bookBar(){
  const b=book(); if(!b) return '<div class="card">還沒有帳本</div>';
  return `<div class="bookbar" data-act="books"><span style="font-size:20px">📒</span>
    <div class="bn">${esc(b.name)}<br><small>${b.state==='closed'?'已封存（唯讀）':'使用中'}・${esc((SETTLE_MODES[bs().mode]||{}).name||'')}</small></div><span>切換 ▾</span></div>
    ${b.state==='closed'?'<div class="closedbar">🗄 這本帳已封存，只能查看。</div>':''}`;
}
function monthRecords(){ return bookRecords().filter(r=> S.month==='all' || r.date.startsWith(S.month)); }
function shiftMonth(n){
  if(S.month==='all') S.month=ym(new Date());
  const [y,m]=S.month.split('-').map(Number); S.month=ym(new Date(y,m-1+n,1)); render();
}
function monthBar(){
  const label = S.month==='all' ? '全部期間' : S.month.replace('-','年')+'月';
  return `<div class="monthbar"><button class="iconbtn" data-act="prev">‹</button>
    <div class="m">${label}</div><button class="iconbtn" data-act="next">›</button>
    <button class="iconbtn" data-act="all" style="width:auto;padding:0 10px;font-size:14px">${S.month==='all'?'本月':'全部'}</button></div>`;
}

function openBookSettings(){

  const others=S.books.filter(x=>x.id!==b.id && x.state==='open');
  modal(`<h2>帳本設定<button data-close>✕</button></h2>
    <div class="field"><label>帳本名稱</label><input id="bName" value="${esc(b.name)}" maxlength="30"></div>
    <div class="field"><label>專戶名稱</label><input id="bFund" value="${esc(s.fundName||'')}" maxlength="40" placeholder="例：媽媽照護專戶（LINE Bank 友感帳戶）"></div>
    <div class="field"><label>新紀錄預設照護對象</label><select id="bBen">${S.beneficiaries.map(x=>`<option ${x===s.defaultBeneficiary?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
    <div class="field"><label>各家分攤比例（0 表示不分攤）</label><div id="gwList">
      ${Object.keys(gw).map(g=>`<div class="gwrow"><input class="gwName" value="${esc(g)}" style="flex:1"><input class="gwVal" type="number" step="0.5" min="0" value="${esc(gw[g])}" style="width:80px"></div>`).join('')}
      <div class="gwrow"><input class="gwName" placeholder="新增家庭名稱" style="flex:1"><input class="gwVal" type="number" step="0.5" min="0" placeholder="比例" style="width:80px"></div></div>
      <p class="hint">成員屬於哪一家，在「成員」→「管理」設定。</p></div>
    <div class="toggle"><span>家人「領取」紀錄預設不公開</span><input type="checkbox" id="bHide" ${s.hideReceiveDefault?'checked':''}></div>
    <p class="hint">不公開的紀錄只有管理員、登記的人和當事人看得到；結算總額仍會包含它們。每筆也可以在明細裡單獨切換。</p>
    <button class="btn" id="bSave" style="margin-top:10px">儲存設定</button>
    <div class="card" style="margin-top:16px;background:#f6f7f9">
      <h3>封存帳本</h3>
      ${b.state==='open'?`<p class="hint">所有紀錄都結算後才能封存。封存後只能查看。</p>
        <div class="field"><label>專戶結餘轉入</label><select id="bTo"><option value="">不轉（保留在本帳）</option>
          ${others.map(o=>`<option value="${esc(o.id)}">${esc(o.name)}</option>`).join('')}</select></div>
        <p class="hint">目前結餘 ${money((sumOf().fund||{}).balance||0)}</p>
        <button class="btn danger" id="bClose">封存這本帳</button>`

    try{ const r=await api('closeBook',{bookId:b.id, transferTo:to}); closeModal(); toast(r.transferred?`已封存，結餘 ${money(r.balance)} 已轉入`:'已封存');
      if(to){ S.bookId=to; store('bookId',to); } await reload(); }catch(e){ toast(e.message); } };
  if($('#bReopen')) $('#bReopen').onclick=async()=>{ try{ await api('reopenBook',{bookId:b.id}); closeModal(); toast('已重新開啟'); await reload(); }catch(e){ toast(e.message); } };

/* ─── 明細 ─── */
function renderList(){
  let html = `<div class="seg"><button data-view="list" class="${S.listView==='list'?'on':''}">清單</button>
    <button data-view="stats" class="${S.listView==='stats'?'on':''}">統計</button></div>`;
  if(S.listView==='stats') return html + renderStats();
  let rs = monthRecords();
  if(S.mineOnly) rs = rs.filter(r=>r.createdBy===S.me.userId);
  if(S.cat) rs = rs.filter(r=>r.category===S.cat);
  rs.sort((a,b)=> b.date.localeCompare(a.date) || String(b.createdAt).localeCompare(String(a.createdAt)));
  const sum = rs.reduce((s,r)=>s+r.amount,0);
  html += monthBar();
  html += `<div class="chips">
    <button class="chip ${!S.mineOnly?'on':''}" data-mine="0">全部人</button>
    <button class="chip ${S.mineOnly?'on':''}" data-mine="1">只看我記的</button>
    <span style="width:8px;flex:none"></span>
    <button class="chip ${!S.cat?'on':''}" data-cat="">全部類別</button>
    ${S.categories.map(c=>`<button class="chip ${S.cat===c?'on':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}
  </div>`;
  html += `<div class="total"><div><small>合計 ${rs.length} 筆</small></div><b>${money(sum)}</b></div>`;
  if(!rs.length) return html + `<div class="empty">這段期間沒有紀錄${S.month!=='all'?'<br>可以按上方「全部」看全部期間':''}</div>`;
  let last='';
  for(const r of rs){
    if(r.date!==last){
      const daySum = rs.filter(x=>x.date===r.date).reduce((s,x)=>s+x.amount,0);
      html += `<div class="dayhead"><span>${dayLabel(r.date)}</span><span>${money(daySum)}</span></div>`; last=r.date;
    }
    const mine = r.createdBy===S.me.userId;
    html += `<div class="rec ${mine?'mine':''}" data-id="${esc(r.id)}">
      <div class="body"><div class="t">${esc(r.item)}${r.hasReceipt?' 📎':''}${lockTag(r)}</div>
        <div class="meta"><span class="tag">${esc(r.category)}</span>${benTag(r.beneficiary)}付款：${esc(memberName(r.payerId))}　記錄：${esc(r.createdByName)}</div>
        ${r.note?`<div class="note">${esc(r.note)}</div>`:''}</div>
      <div><div class="amt">${money(r.amount)}</div><div style="text-align:right"><span class="st st-${esc(r.status)}">${esc(r.status)}</span></div></div>
    </div>`;
  }
  html += `<button class="btn ghost" data-act="csv" style="margin-top:14px">⬇︎ 匯出這份清單（CSV）</button>`;
  return html;
}
function renderStats(){
  const rs = monthRecords();
  const total = rs.reduce((s,r)=>s+r.amount,0);
  const group = key => { const o={}; rs.forEach(r=>{ const k=key(r); o[k]=(o[k]||0)+r.amount; }); return Object.entries(o).sort((a,b)=>b[1]-a[1]); };
  const bars = (arr,color) => arr.length ? arr.map(([c,v])=>`<div class="catrow"><div class="l"><span>${esc(c)}</span>
      <span>${money(v)}　<small style="color:var(--sub)">${total?Math.round(v/total*100):0}%</small></span></div>
      <div class="bar" style="width:${Math.max(2,v/arr[0][1]*100)}%;${color?'background:'+color:''}"></div></div>`).join('') : '<p class="hint">沒有資料</p>';
  return monthBar() + `<div class="total"><div><small>${rs.length} 筆支出</small></div><b>${money(total)}</b></div>
    <div class="card"><h3>依類別</h3>${bars(group(r=>r.category))}</div>
    <div class="card"><h3>依照護對象</h3>${bars(group(r=>r.beneficiary==='共同'?'爸媽共同':r.beneficiary),'#b0407a')}</div>
    <div class="card"><h3>依付款人</h3>${bars(group(r=>memberName(r.payerId)),'#1e9e62')}</div>`;
}

  catch(e){ toast(e.message); }

function renderSettle(){
  const mode = SETTLE_MODES[bs().mode] || SETTLE_MODES.equal;
  let html = `<div class="card"><h3>結算方式${isAdmin()&&book().state==='open'?'<button class="mini" data-act="mode">變更</button>':''}</h3>
    <b>${esc(mode.name)}</b>${bs().mode==='fundCap'?`（每期上限 ${money(bs().cap)}）`:''}
    <p class="hint" style="margin-bottom:0">${esc(mode.desc)}</p>
    <p class="hint" style="margin-bottom:0">各家比例：${Object.entries(bs().groupWeights||{}).filter(([g,w])=>w>0).map(([g,w])=>esc(g)+' '+w).join('：')||'未設定'}</p></div>`;
  const c = S.preview;
  if(!c) return html + `<div class="center" style="padding:30px"><div class="spinner"></div></div>`;
  const usesFund = ['fund','fundFirst','fundCap','estate'].includes(c.mode);
  html += `<div class="card"><h3>本期結算預覽</h3>
    <div class="field"><label>結算到哪一天（含當天以前所有未結清的紀錄）</label><input type="date" id="cutoff" value="${esc(S.cutoff)}"></div>

    ${c.fundDirect?`<div class="kv"><span>${esc(fundShort())}直接付款</span><span>${money(c.fundDirect)}</span></div>`:''}
    ${c.estateDirect?`<div class="kv"><span>爸爸帳戶直接付款</span><span>${money(c.estateDirect)}</span></div>`:''}
    <div class="kv"><span>家人墊付</span><span>${money(c.memberPaid)}</span></div>
    ${c.received?`<div class="kv"><span>家人已從專戶領取</span><span>${money(c.received)}</span></div>`:''}
    ${usesFund?`<div class="kv"><span>專戶撥還家人</span><span class="pos">${money(c.fundReimburse)}</span></div>
      <div class="kv"><span>專戶目前餘額</span><span>${money((sumOf().fund||{}).balance||0)}</span></div>`:''}
    ${c.mode==='estate'?`<div class="kv"><span>列為遺產清償</span><span>${money(c.estateClaimTotal)}</span></div>`
      :`<div class="kv"><span>家人依比例分攤</span><span>${money(c.familyShare)}</span></div>`}</div>`;
  if(c.warnings.length) html += `<div class="card warn">${c.warnings.map(w=>`<div>⚠️ ${esc(w)}</div>`).join('')}</div>`;
  if(c.groupRows.length){
    html += `<div class="card"><h3>各單位明細</h3><table><tr><th>單位</th><th>墊付</th>${c.received?'<th>已領</th>':''}${usesFund?'<th>撥還</th>':''}<th>應分攤</th><th>差額</th></tr>
      ${c.groupRows.map(g=>`<tr><td>${esc(g.group)}<br><small style="color:var(--sub)">${esc(g.members.join('、'))}</small></td><td>${num(g.paid)}</td>
        ${c.received?`<td>${num(g.recv)}</td>`:''}${usesFund?`<td>${num(g.reimb)}</td>`:''}<td>${num(g.share)}</td>
        <td class="${g.net>=0.5?'pos':g.net<=-0.5?'neg':''}">${signed(g.net)}</td></tr>`).join('')}</table>
      <p class="hint">差額為正：其他家要再還；為負：要補給其他家。${c.mode==='estate'?'遺產清償模式下，正的差額列為待遺產分割時清償。':''}</p></div>`;
  }
  html += `<div class="card"><h3>要轉的錢</h3>`;
  html += c.returns.map(t=>`<div class="transfer ret"><span>${esc(t.name)} → 🏦 專戶（領取多於墊付，退回）</span><b>${money(t.amount)}</b></div>`).join('');
  html += c.reimburse.map(t=>`<div class="transfer fundt"><span>🏦 專戶 → ${esc(t.name)}</span><b>${money(t.amount)}</b></div>`).join('');
  html += c.transfers.map(t=>`<div class="transfer"><span>${esc(t.from)} → ${esc(t.to)}</span><b>${money(t.amount)}</b></div>`).join('');
  html += c.estateClaims.map(t=>`<div class="transfer claim"><span>📜 待遺產分割時清償給 ${esc(t.name)}</span><b>${money(t.amount)}</b></div>`).join('');

  html += `</div>`;
  if(isAdmin() && book().state==='open'){
    const n=c.includedIds.length+c.receiptIds.length;
    html += `<button class="btn green" data-act="settle" ${c.blocked||!n?'disabled':''}>完成本期結算</button>
      <p class="hint" style="text-align:center">按下後：專戶自動記下撥付／退回，這 ${n} 筆標記已結清並鎖定。</p>`;

      <small>${esc((SETTLE_MODES[s.mode]||{}).name||s.mode)}・截至 ${esc(s.cutoff)}・${s.recordCount} 筆・專戶負擔 ${money(s.fundTotal)}・家人分攤 ${money(s.familyShare)}${s.state!=='有效'?'・<b>已撤銷</b>':''}</small>
      ${s.returns.map(t=>`<div><small>${esc(memberName(t.id))} → 專戶 ${money(t.amount)}</small></div>`).join('')}
      ${s.reimburse.map(t=>`<div><small>🏦 專戶 → ${esc(memberName(t.id))} ${money(t.amount)}</small></div>`).join('')}
      ${s.transfers.map(t=>`<div><small>${esc(t.from)} → ${esc(t.to)} ${money(t.amount)}</small></div>`).join('')}
      ${s.estateClaims.map(t=>`<div><small>📜 待遺產清償：${esc(memberName(t.id))} ${money(t.amount)}</small></div>`).join('')}
      ${isAdmin()&&book().state==='open'&&lastValid&&s.id===lastValid.id?`<button class="mini" data-undo="${esc(s.id)}" style="margin:6px 0 0">撤銷這次結算</button>`:''}
    </div>`).join('') : '<p class="hint">還沒有結算過。</p>'}</div>`;
  return html;
}
function openModeForm(){

/* ─── 專戶 ─── */
function renderFund(){
  const f = sumOf().fund || {balance:0,deposits:0,returned:0,payouts:0,direct:0,transferredOut:0,bySource:{}};
  const recs=bookRecords(), now=new Date(), lm=[];
  for(let k=1;k<=3;k++){ const m=ym(new Date(now.getFullYear(), now.getMonth()-k, 1)); lm.push(recs.filter(r=>r.date.startsWith(m)).reduce((s,r)=>s+r.amount,0)); }
  const avg = lm.reduce((a,b)=>a+b,0)/3;
  const low = bs().lowBalance && f.balance < bs().lowBalance && book().state==='open';
  let html = `<div class="card fund"><div class="sub">${esc(bs().fundName||'專戶')}　帳本餘額</div><div class="bal">${money(f.balance)}</div>
    <div class="grid"><div>累計存入<b>${money(f.deposits+f.returned)}</b></div><div>撥還家人<b>${money(f.payouts)}</b></div><div>直接付款<b>${money(f.direct)}</b></div></div>
    ${f.transferredOut?`<div class="sub" style="margin-top:6px">已轉出到其他帳本 ${money(f.transferredOut)}</div>`:''}
    ${avg>0?`<div class="sub" style="margin-top:8px">近 3 個月平均每月支出 ${money(avg)}，餘額約可支應 ${(Math.max(0,f.balance)/avg).toFixed(1)} 個月</div>`:''}</div>`;
  if(low) html += `<div class="card warn">⚠️ 專戶餘額低於提醒水位 ${money(bs().lowBalance)}，請依約定比例補充資金（見下方「出資平衡」）。</div>`;
  if(canWrite()) html += `<div class="row2" style="margin-bottom:12px"><button class="btn" data-act="fundAdd">＋ 存入</button>
    <button class="btn ghost" data-act="recvAdd">－ 領取</button></div>
    <p class="hint" style="margin-top:-6px">「領取」：家人直接從爸爸帳戶拿出來的錢（例如賣股票款）。結算時會和他墊付的金額相抵。</p>`;
  const ct = sumOf().contribution;
  if(ct && ct.rows.length && ct.total>0){
    html += `<div class="card"><h3>出資平衡（約定 ${ct.rows.map(r=>esc(r.group)+' '+r.weight).join('：')}）</h3>
      <table><tr><th>家庭</th><th>已出資</th><th>應出資</th><th>差額</th></tr>
      ${ct.rows.map(r=>`<tr><td>${esc(r.group)}</td><td>${num(r.contributed)}</td><td>${num(r.target)}</td><td class="${r.diff>=0.5?'pos':r.diff<=-0.5?'neg':''}">${signed(r.diff)}</td></tr>`).join('')}</table>
      <p class="hint">已出資＝「家人出資」存入＋歷次結算的分攤。下次補錢時，差額為負的家庭可以多存一些來拉平。</p></div>`;
  }
  const src = Object.entries(f.bySource).sort((a,b)=>b[1]-a[1]);
  html += `<div class="card"><h3>資金來源</h3>${src.length? src.map(([k,v])=>`<div class="catrow"><div class="l"><span>${esc(k)}</span>
     <span>${money(v)}　<small style="color:var(--sub)">${Math.round(v/f.deposits*100)}%</small></span></div>
     <div class="bar" style="width:${Math.max(2,v/src[0][1]*100)}%;background:var(--ok)"></div></div>`).join('') : '<p class="hint">還沒有存入紀錄。每筆存入都要登記資金來源。</p>'}</div>`;

      :'<p class="hint">每月一次，把銀行 App 看到的實際餘額輸入進來，帳本會自動比對。</p>'}</div>`;
  const items = [...bookFund().map(x=>({kind:x.type, date:x.date, x})),
    ...recs.filter(r=>r.payerId===FUND_ID).map(r=>({kind:'直接付款', date:r.date, r}))].sort((a,b)=>b.date.localeCompare(a.date));
  html += `<div class="card"><h3>專戶明細</h3>${items.length?'':'<p class="hint">沒有資料</p>'}`;

    <div class="body"><div class="t">${title}</div><div class="meta">${meta}</div></div><div class="amt ${cls}">${amt}</div></div>`;

    else if(it.kind==='領取') html += row(`data-fund="${esc(x.id)}"`, x.createdBy===S.me.userId, `<span class="tag" style="background:var(--warn-soft);color:var(--warn)">領取</span>${esc(memberName(x.memberId))} 從專戶領取${lockTag(x)}`,
      `${esc(x.date)}　${esc(x.note||'')}${x.settlementId?'　・已結算':''}`, num(x.amount), '');
    else if(it.kind==='撥付') html += row('', false, `撥還 ${esc(memberName(x.memberId))}`, `${esc(x.date)}　${esc(x.note)}`, '−'+num(x.amount), 'out');
    else if(it.kind==='退回') html += row('', false, `${esc(memberName(x.memberId))} 退回專戶`, `${esc(x.date)}　${esc(x.note)}`, '+'+num(x.amount), 'in');
    else if(it.kind==='轉出') html += row('', false, '結餘轉出', `${esc(x.date)}　${esc(x.note)}`, '−'+num(x.amount), 'out');
    else { const r=it.r; html += row(`data-id="${esc(r.id)}"`, false, esc(r.item)+lockTag(r), `${esc(r.date)}　專戶直接付款・${esc(r.category)}`, '−'+num(r.amount), 'out'); }
  }
  html += `</div><p class="hint">・存入：每筆都要登記資金來源；「家人出資」會記在出資人那一家。<br>・撥付、退回、結餘轉出由系統自動產生，不能手動修改。<br>・帳戶只填末 4 碼。</p>`;
  return html;
}

function groupList(){
  const names=[...new Set(S.members.filter(m=>m.group && m.state!=='removed').map(m=>m.group))];
  S.books.forEach(b=>Object.keys((b.settings||{}).groupWeights||{}).forEach(g=>{ if(!names.includes(g)) names.push(g); }));
  return names.map(g=>({ name:g, members:S.members.filter(m=>m.group===g && m.state!=='removed'),
    weights:S.books.map(b=>({ book:b, w:((b.settings||{}).groupWeights||{})[g] })) }));
}

async function act(a){
  if(a==='prev') return shiftMonth(-1);
  if(a==='next') return shiftMonth(1);
  if(a==='all'){ S.month = S.month==='all'? ym(new Date()) : 'all'; return render(); }
  if(a==='books') return openBooks();
  if(a==='csv') return exportCsv();
  if(a==='mode') return openModeForm();
  if(a==='fundAdd') return openFundForm('存入');
  if(a==='recvAdd') return openFundForm('領取');
  if(a==='recon') return openRecon();
  if(a==='copy'){ const i=$('#inviteLink'); i.select(); try{ await navigator.clipboard.writeText(i.value); }catch(e){ document.execCommand('copy'); } return toast('已複製邀請連結'); }
  if(a==='share'){ try{ await liff.shareTargetPicker([{type:'text', text:'💙 爸媽照護帳本\n點這個連結用 LINE 登入，就能一起查看與記錄照護費用：\nhttps://liff.line.me/'+CONFIG.LIFF_ID}]); }catch(e){ toast('分享取消'); } return; }
  if(a==='rename'){ const v=$('#myName').value.trim(); if(!v) return toast('請輸入名字');
    try{ await api('rename',{name:v}); toast('已更新名字'); await reload(); }catch(e){ toast(e.message); } return; }
  if(a==='settle'){
    const c=S.preview; if(!c) return;
    const label = prompt('這次結算的名稱', S.cutoff.slice(0,7).replace('-','年')+'月');
    if(label===null) return;
    const lines=[`${c.modeName}，截至 ${S.cutoff}，支出 ${money(c.total)}`]
      .concat(c.returns.map(t=>`${t.name} → 專戶 ${money(t.amount)}`))
      .concat(c.reimburse.map(t=>`專戶 → ${t.name} ${money(t.amount)}`))
      .concat(c.transfers.map(t=>`${t.from} → ${t.to} ${money(t.amount)}`))
      .concat(c.estateClaims.map(t=>`待遺產清償：${t.name} ${money(t.amount)}`));
    if(!confirm('確定完成結算？\n\n'+lines.join('\n')+'\n\n請記得實際完成上述轉帳。')) return;
    try{ await api('settle',{bookId:book().id, cutoff:S.cutoff, label, expectTotal:c.total}); toast('結算完成'); await reload(); }catch(e){ toast(e.message); }
  }
}

function shrinkImage(file){
  return new Promise((ok,no)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{ const max=1400; let {width:w,height:h}=img;
      if(Math.max(w,h)>max){ const k=max/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
      const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg',0.72)); };
    img.onerror=no; img.src=url; });
}
