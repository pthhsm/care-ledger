var RECON_COLS = ['id', 'bookId', 'date', 'bankBalance', 'ledgerBalance', 'diff', 'note', 'createdBy', 'createdAt', 'deleted'];
var LOG_COLS = ['time', 'userId', 'name', 'action', 'refId', 'detail'];

var DEFAULT_BOOKS = [
  { id: 'father', name: '爸爸生前照護及喪葬帳', kind: 'father', settings: {
    mode: 'fundFirst', cap: 0, lowBalance: 0, fundName: '結清專戶', defaultBeneficiary: '爸爸',
    groupWeights: { '士民家': 1, '大哥家': 1 }, hideReceiveDefault: true } },
  { id: 'mother', name: '媽媽照護帳', kind: 'mother', settings: {
    mode: 'fundFirst', cap: 0, lowBalance: 50000, fundName: '媽媽照護專戶（LINE Bank 友感帳戶）', defaultBeneficiary: '媽媽',
    groupWeights: { '士民家': 1, '大哥家': 1 }, hideReceiveDefault: false } }
];

/* ═══════ 結算核心（前後端共用同一份邏輯） ═══════ */
var SETTLE_MODES = {
  equal:     { name: '各家均分',               desc: '每個參與分攤的家庭平均負擔，不動用專戶。' },
  ratio:     { name: '依比例分攤',             desc: '依各家設定的比例負擔（例如 1:1），不動用專戶。' },
  fund:      { name: '專戶全額支付',           desc: '家人墊付的款項全部由專戶撥還。專戶不夠時無法結算，需先存入。' },
  fundFirst: { name: '專戶優先，不足依比例分攤', desc: '先用專戶撥還，專戶不夠的部分再依各家比例分攤。' },
  fundCap:   { name: '專戶每期上限',           desc: '專戶每期最多負擔設定金額（含專戶直接付款），超過的部分依各家比例分攤。' },
  estate:    { name: '不足列為遺產清償',       desc: '先用專戶撥還，不夠的部分列為「待遺產分割時清償」，家人先不分攤。' }
};
var FUND_SOURCES = ['農保喪葬津貼', '遺產分配', '家人出資', '媽媽收入', '政府補助', '上一本結餘',
  '銀行存款', '股票', '基金', '不動產', '保險理賠', '其他'];
var FUND_ID = 'FUND';     // 由本帳專戶直接付款
var ESTATE_ID = 'ESTATE'; // 由爸爸帳戶（遺產）直接付款，不經專戶

/** 專戶餘額。「領取」是家人直接從爸爸帳戶拿的錢，不經過專戶，所以不影響餘額 */
function computeFundSummary(fundEntries, records) {
  var s = { deposits: 0, returned: 0, payouts: 0, transferredOut: 0, direct: 0, received: 0, balance: 0, bySource: {} };
  fundEntries.forEach(function (f) {
    var a = Number(f.amount) || 0;
    if (f.type === '存入') { s.deposits += a; s.bySource[f.source || '其他'] = (s.bySource[f.source || '其他'] || 0) + a; }
    else if (f.type === '退回') s.returned += a;
    else if (f.type === '撥付') s.payouts += a;
    else if (f.type === '轉出') s.transferredOut += a;
    else if (f.type === '領取') s.received += a;
  });
  records.forEach(function (r) { if (r.payerId === FUND_ID) s.direct += Number(r.amount) || 0; });
  s.balance = s.deposits + s.returned - s.payouts - s.transferredOut - s.direct;
  return s;
}

function groupOf_(m) { return (m && String(m.group || '').trim()) || (m ? m.name : '?'); }

/**
 * inp: { records:[{id,amount,payerId}], receipts:[{id,memberId,amount}], members:[{userId,name,group}],
 *        groupWeights:{家庭:比例}, mode, cap, fundAvailable }
 */
function computeSettlement(inp) {
  var mode = SETTLE_MODES[inp.mode] ? inp.mode : 'equal';
  var mem = {}, warnings = [];
  inp.members.forEach(function (m) { mem[m.userId] = m; });
  var paid = {}, recv = {}, fundDirect = 0, estateDirect = 0, P = 0;
  var included = [], unknown = [], receiptIds = [];
  inp.records.forEach(function (r) {
    var a = Number(r.amount) || 0;
    if (r.payerId === FUND_ID) { fundDirect += a; included.push(r.id); }
    else if (r.payerId === ESTATE_ID) { estateDirect += a; included.push(r.id); }
    else if (r.payerId && mem[r.payerId]) { paid[r.payerId] = (paid[r.payerId] || 0) + a; P += a; included.push(r.id); }
    else unknown.push(r.id);
  });
  (inp.receipts || []).forEach(function (f) {
    if (mem[f.memberId]) { recv[f.memberId] = (recv[f.memberId] || 0) + (Number(f.amount) || 0); receiptIds.push(f.id); }
  });

  // 每位成員：墊付 − 已領取。領取多於墊付的部分要退回專戶
  var ids = {};
  Object.keys(paid).forEach(function (k) { ids[k] = 1; });
  Object.keys(recv).forEach(function (k) { ids[k] = 1; });
  var people = Object.keys(ids).map(function (id) {
    var p = paid[id] || 0, r = recv[id] || 0;
    return { id: id, name: mem[id].name, group: groupOf_(mem[id]), paid: p, recv: r,
      adv: Math.max(0, p - r), hold: Math.max(0, r - p), reimbF: 0, reimb: 0 };
  });
  var returns = people.filter(function (x) { return Math.round(x.hold) > 0; })
    .map(function (x) { return { id: x.id, name: x.name, amount: Math.round(x.hold) }; });
  var H = returns.reduce(function (s, x) { return s + x.amount; }, 0);
  var A = people.reduce(function (s, x) { return s + x.adv; }, 0);

  var avail = Math.max(0, Number(inp.fundAvailable) || 0) + H;
  if ((Number(inp.fundAvailable) || 0) < 0) warnings.push('專戶餘額是負數，請先登記存入');
  var capacity = 0;
  if (mode === 'fund' || mode === 'fundFirst' || mode === 'estate') capacity = avail;
  else if (mode === 'fundCap') capacity = Math.max(0, Math.min(avail, (Number(inp.cap) || 0) - fundDirect));
  var R = Math.min(capacity, A);
  var shortfall = mode === 'fund' ? Math.max(0, A - R) : 0;
  if (shortfall > 0.5) warnings.push('專戶不足 ' + Math.round(shortfall) + ' 元，需先存入才能結算（或改用「專戶優先，不足依比例分攤」）');
  var S = (mode === 'fund' || mode === 'estate') ? 0 : A - R;

  // 家庭（分攤單位）
  var gw = inp.groupWeights || {}, groups = {};
  inp.members.forEach(function (m) {
    var g = groupOf_(m);
    if (!groups[g]) groups[g] = { group: g, members: [], w: 0, adv: 0, paid: 0, recv: 0, share: 0, reimb: 0, net: 0 };
    if (groups[g].members.indexOf(m.name) < 0) groups[g].members.push(m.name);
  });
  Object.keys(groups).forEach(function (g) {
    var w = Number(gw[g]) || 0;
    groups[g].w = mode === 'equal' ? (w > 0 ? 1 : 0) : w;
  });
  var W = Object.keys(groups).reduce(function (s, g) { return s + groups[g].w; }, 0);
  if (S > 0.5 && W === 0) warnings.push('沒有設定參與分攤的家庭比例，請到「成員」頁設定');
  people.forEach(function (x) { var g = groups[x.group]; g.adv += x.adv; g.paid += x.paid; g.recv += x.recv; });
  Object.keys(groups).forEach(function (k) { var g = groups[k]; g.share = W > 0 ? S * g.w / W : 0; });

  // 專戶撥還：優先給「多付」的家庭，家庭內再依各人墊付比例分配
  var pos = 0;
  Object.keys(groups).forEach(function (k) { var g = groups[k]; g.excess = g.adv - g.share; if (g.excess > 0) pos += g.excess; });
  if (R > 0 && pos > 0) {
    people.forEach(function (x) {
      var g = groups[x.group];
      x.reimbF = (g.excess > 0 && g.adv > 0) ? R * (g.excess / pos) * (x.adv / g.adv) : 0;
    });
    var target = Math.round(R), acc = 0;
    people.forEach(function (x) { x.reimb = Math.floor(x.reimbF); acc += x.reimb; });
    var order = people.slice().sort(function (a, b) { return (b.reimbF - b.reimb) - (a.reimbF - a.reimb); });
    for (var i = 0; acc < target && i < order.length; i++) { if (order[i].reimbF > 0) { order[i].reimb++; acc++; } }
  }
  people.forEach(function (x) { groups[x.group].reimb += x.reimb; });
  var groupRows = Object.keys(groups).map(function (k) {
    var g = groups[k]; g.net = g.adv - g.reimb - g.share;
    return { group: g.group, members: g.members, weight: g.w, paid: g.paid, recv: g.recv, adv: g.adv,
      reimb: g.reimb, share: g.share, net: g.net };
  }).filter(function (g) { return g.paid || g.recv || g.weight; });

  var transfers = [], estateClaims = [];
  if (mode === 'estate') {
    estateClaims = people.map(function (x) { return { id: x.id, name: x.name, amount: Math.round(x.adv - x.reimb) }; })
      .filter(function (c) { return c.amount > 0; });
  } else {
    var cred = groupRows.filter(function (g) { return g.net > 0.5; }).map(function (g) { return { name: g.group, v: g.net }; });
    var debt = groupRows.filter(function (g) { return g.net < -0.5; }).map(function (g) { return { name: g.group, v: -g.net }; });
    cred.sort(function (a, b) { return b.v - a.v; }); debt.sort(function (a, b) { return b.v - a.v; });
    var a = 0, b = 0;
    while (a < debt.length && b < cred.length) {
      var x = Math.min(debt[a].v, cred[b].v);
      if (Math.round(x) > 0) transfers.push({ from: debt[a].name, to: cred[b].name, amount: Math.round(x) });
      debt[a].v -= x; cred[b].v -= x;
      if (debt[a].v < 0.5) a++;
      if (cred[b].v < 0.5) b++;
    }
  }
  if (unknown.length) warnings.push(unknown.length + ' 筆沒有填付款人，這次不會結算');
  var reimburse = people.filter(function (x) { return x.reimb > 0; })
    .map(function (x) { return { id: x.id, name: x.name, amount: x.reimb }; });
  return {
    mode: mode, modeName: SETTLE_MODES[mode].name,
    total: fundDirect + estateDirect + P, fundDirect: fundDirect, estateDirect: estateDirect, memberPaid: P,
    received: people.reduce(function (s, x) { return s + x.recv; }, 0),
    fundReimburse: Math.round(R), fundTotal: fundDirect + Math.round(R), familyShare: Math.round(S),
    estateClaimTotal: estateClaims.reduce(function (s, c) { return s + c.amount; }, 0),
    people: people.map(function (x) { return { id: x.id, name: x.name, group: x.group, paid: x.paid, recv: x.recv, reimb: x.reimb }; }),
    groupRows: groupRows, reimburse: reimburse, returns: returns, transfers: transfers, estateClaims: estateClaims,
    includedIds: included, receiptIds: receiptIds, unknownIds: unknown,
    blocked: shortfall > 0.5 || (S > 0.5 && W === 0), warnings: warnings
  };
}

/** 出資平衡：各家實際出資（家人出資存入＋歷次結算分攤）與約定比例的差距 */
function computeContribution(fundEntries, settlements, members, groupWeights) {
  var byId = {}, c = {};
  members.forEach(function (m) { byId[m.userId] = m; });
  fundEntries.forEach(function (f) {
    if (f.type === '存入' && f.source === '家人出資' && byId[f.memberId]) {
      var g = groupOf_(byId[f.memberId]); c[g] = (c[g] || 0) + (Number(f.amount) || 0);
    }
  });
  settlements.forEach(function (s) {
    if (s.state !== '有效') return;
    (s.groupRows || []).forEach(function (g) { if (g.share) c[g.group] = (c[g.group] || 0) + g.share; });
  });
  var gw = groupWeights || {}, W = 0;
  Object.keys(gw).forEach(function (g) { W += Number(gw[g]) || 0; });
  var total = Object.keys(c).reduce(function (s, g) { return s + c[g]; }, 0);
  var rows = Object.keys(gw).filter(function (g) { return Number(gw[g]) > 0; }).map(function (g) {
    var target = W ? total * gw[g] / W : 0;
    return { group: g, weight: Number(gw[g]), contributed: c[g] || 0, target: target, diff: (c[g] || 0) - target };
  });
  return { total: total, rows: rows };
}
/* ═══════ 結算核心結束 ═══════ */


/* ───────────── 入口 ───────────── */

function doGet() {
  return json_({ ok: true, app: 'care-ledger', version: 2, time: new Date().toISOString(),
    channelIdSet: !!String(prop_('LINE_CHANNEL_ID') || '').trim() });
}

function doPost(e) {
  MEMO_ = {};
  try {
    SS_ = null; SHEETS_ = {}; MEMO_ = {};
    var req = JSON.parse(e.postData.contents || '{}');
    var me = auth_(req.token);
    var fn = ACTIONS[req.action];
    if (!fn) throw err_('BAD_ACTION', '未知的動作');
    var openToPending = { me: 1, rename: 1 };
    if (!openToPending[req.action] && me.state !== 'active') throw err_('PENDING', '帳號尚待管理員核准');
    var readOnly = { me: 1, list: 1, receipt: 1, rename: 1, preview: 1 };
    if (!readOnly[req.action] && me.role === 'viewer') throw err_('FORBIDDEN', '你是唯讀成員，只能查看');
    var isWrite = !readOnly[req.action];
    var rid = isWrite && req.reqId ? String(req.reqId).slice(0, 40) : '';
    if (rid && !claimReq_(rid)) {            // 同一個動作編號已處理過（連按、網路重試）→ 不重複寫入
      return json_({ ok: true, data: { duplicate: true }, state: bootstrap_(me) });
    }
    var data;
    try { data = fn(me, req); }
    catch (x) { if (rid) CacheService.getScriptCache().remove('rq_' + rid); throw x; }
    var res = { ok: true, data: data };
    if (isWrite && req.action !== 'rename' && me.state === 'active') res.state = bootstrap_(me);   // 一併帶回最新資料
    return json_(res);
  } catch (x) {
    return json_({ ok: false, code: x.code || 'ERROR', message: x.message || String(x) });
  }
}
function claimReq_(id) {
  var lock = LockService.getScriptLock(); lock.waitLock(15000);
  try {
    var c = CacheService.getScriptCache();
    if (c.get('rq_' + id)) return false;
    c.put('rq_' + id, '1', 21600);
    return true;
  } finally { lock.releaseLock(); }
}

var ACTIONS = {
  me: function (me) { return bootstrap_(me); },
  list: function (me) { return bootstrap_(me); },
  add: addRecord_, update: updateRecord_, remove: removeRecord_, receipt: getReceipt_,
  fundAdd: fundAdd_, fundUpdate: fundUpdate_, fundRemove: fundRemove_,
  setHidden: setHidden_, rename: renameSelf_, member: adminMember_,
  bookSettings: bookSettings_, closeBook: closeBook_, reopenBook: reopenBook_,
  preview: preview_, settle: settle_, undoSettle: undoSettle_, recon: recon_, reconRemove: reconRemove_,
  groupSave: groupSave_, groupDelete: groupDelete_
};

/* ───────────── 身分驗證 ───────────── */

function auth_(token) {
  if (!token) throw err_('NO_TOKEN', '沒有取得 LINE 登入資訊。請從 LINE 裡點帳本連結開啟，或在瀏覽器重新登入。');
  var cache = CacheService.getScriptCache();
  var key = 'tk_' + Utilities.base64EncodeWebSafe(
    Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, token)).slice(0, 40);
  var profile, cached = cache.get(key);
  if (cached) {
    profile = JSON.parse(cached);
  } else {
    var channelId = String(prop_('LINE_CHANNEL_ID') || '').replace(/\s/g, '');
    if (!channelId) throw err_('CONFIG', '後端尚未設定 LINE_CHANNEL_ID。請到 Apps Script「專案設定 → 指令碼屬性」新增。');
    var v = UrlFetchApp.fetch('https://api.line.me/oauth2/v2.1/verify?access_token=' +
      encodeURIComponent(token), { muteHttpExceptions: true });
    if (v.getResponseCode() !== 200) {
      var why = ''; try { why = JSON.parse(v.getContentText()).error_description || ''; } catch (e) {}
      throw err_('AUTH_EXPIRED', 'LINE 登入驗證失敗（' + v.getResponseCode() + (why ? '：' + why : '') + '）');
    }
    var vj = JSON.parse(v.getContentText());
    if (String(vj.client_id) !== channelId) {
      throw err_('CHANNEL_MISMATCH', '後端設定的 LINE_CHANNEL_ID 是「' + channelId + '」，但這個 LIFF 屬於 Channel ID「' + vj.client_id +
        '」。請到 Apps Script「專案設定 → 指令碼屬性」把 LINE_CHANNEL_ID 改成 ' + vj.client_id + '，存檔後重新整理帳本即可（不用重新部署）。');
    }
    var p = UrlFetchApp.fetch('https://api.line.me/v2/profile', {
      headers: { Authorization: 'Bearer ' + token }, muteHttpExceptions: true });
    if (p.getResponseCode() !== 200) {
      throw err_('PROFILE', '讀不到 LINE 個人資料（' + p.getResponseCode() + '）。請確認 LIFF 的 Scopes 有勾選 profile。');
    }
    profile = JSON.parse(p.getContentText());
    cache.put(key, JSON.stringify(profile), Math.min(600, Math.max(60, (vj.expires_in || 600) - 30)));
  }
  return upsertMember_(profile);
}

function upsertMember_(profile) {
  var sh = sheet_('Members', MEM_COLS);
  var rows = readAll_(sh, MEM_COLS);
  for (var i = 0; i < rows.length; i++) {
    if (rows[i].userId === profile.userId) {
      var m = rows[i];
      if (m.lineName !== profile.displayName || m.pictureUrl !== (profile.pictureUrl || '')) {
        m.lineName = profile.displayName; m.pictureUrl = profile.pictureUrl || '';
        writeRow_(sh, m._row, MEM_COLS, m);
      }
      return m;
    }
  }
  return withLock_(function () {
    var first = readAll_(sh, MEM_COLS).length === 0;
    var nm = { userId: profile.userId, name: profile.displayName, nameSet: false, lineName: profile.displayName,
      pictureUrl: profile.pictureUrl || '', role: first ? 'admin' : 'member', state: first ? 'active' : 'pending',
      group: '', joinedAt: new Date().toISOString() };
    sh.appendRow(MEM_COLS.map(function (c) { return nm[c]; }));
    nm._row = sh.getLastRow();
    log_(nm, first ? 'join_admin' : 'join_request', '', '');
    return nm;
  });
}

/* ───────────── 讀取 ───────────── */

function isTrue_(v) { return v === true || v === 'TRUE'; }

function members_() {
  return readAll_(sheet_('Members', MEM_COLS), MEM_COLS).map(function (m) {
    return { userId: m.userId, name: m.name, nameSet: isTrue_(m.nameSet), lineName: m.lineName, pictureUrl: m.pictureUrl,
      role: m.role, state: m.state, group: m.group || '' };
  });
}
function nameMap_() { var o = {}; members_().forEach(function (m) { o[m.userId] = m.name; }); return o; }

function books_() {
  var sh = sheet_('Books', BOOK_COLS);
  var rows = readAll_(sh, BOOK_COLS);
  if (!rows.length) {
    var now = new Date().toISOString();
    DEFAULT_BOOKS.forEach(function (b) {
      sh.appendRow([b.id, b.name, b.kind, 'open', JSON.stringify(b.settings), now, '']);
    });
    rows = readAll_(sh, BOOK_COLS);
  }
  return rows.map(function (b) {
    var s = {}; try { s = JSON.parse(b.settings || '{}'); } catch (e) {}
    return { _row: b._row, id: b.id, name: b.name, kind: b.kind, state: b.state || 'open', settings: s,
      createdAt: b.createdAt, closedAt: b.closedAt };
  });
}
function book_(id, mustBeOpen) {
  var b = books_().filter(function (x) { return x.id === id; })[0];
  if (!b) throw err_('INPUT', '找不到這本帳');
  if (mustBeOpen && b.state !== 'open') throw err_('LOCKED', '這本帳已封存，不能再修改');
  return b;
}
function records_() {
  return readAll_(sheet_('Records', REC_COLS), REC_COLS).filter(function (r) { return !isTrue_(r.deleted); });
}
function fund_() {
  return readAll_(sheet_('Fund', FUND_COLS), FUND_COLS).filter(function (f) { return !isTrue_(f.deleted); });
}
function settlements_() {
  return readAll_(sheet_('Settlements', SET_COLS), SET_COLS).map(function (s) {
    var d = {}; try { d = JSON.parse(s.detail || '{}'); } catch (e) {}
    return { id: s.id, bookId: s.bookId, label: s.label, cutoff: fmtDate_(s.cutoff), mode: s.mode, total: Number(s.total),
      fundTotal: Number(s.fundTotal), familyShare: Number(s.familyShare), recordCount: Number(s.recordCount),
      state: s.state, createdBy: s.createdBy, createdAt: s.createdAt,
      reimburse: d.reimburse || [], returns: d.returns || [], transfers: d.transfers || [],
      groupRows: d.groupRows || [], estateClaims: d.estateClaims || [] };
  });
}

/** 隱藏的紀錄只有管理員、建立者、當事人看得到 */
function canSee_(me, x) {
  if (!isTrue_(x.hidden)) return true;
  return me.role === 'admin' || x.createdBy === me.userId || x.memberId === me.userId || x.payerId === me.userId;
}

function bootstrap_(me) {
  var members = members_();
  var books = books_().map(function (b) { delete b._row; return b; });
  var out = { me: { userId: me.userId, name: me.name, nameSet: isTrue_(me.nameSet), role: me.role, state: me.state },
    members: members.filter(function (m) { return m.state !== 'removed' || me.role === 'admin'; }),
    books: books, records: [], fund: [], settlements: [], recon: [], summary: {},
    categories: CATEGORIES, beneficiaries: BENEFICIARIES, fundSources: FUND_SOURCES,
    modes: SETTLE_MODES, fundId: FUND_ID, estateId: ESTATE_ID };
  if (me.state !== 'active') {
    out.members = members.filter(function (m) { return m.userId === me.userId; });
    out.books = [];
    return out;
  }
  var names = {}; members.forEach(function (m) { names[m.userId] = m.name; });
  var recs = records_().map(publicRecord_), fund = fund_().map(publicFund_), sets = settlements_();
  books.forEach(function (b) {
    var br = recs.filter(function (r) { return r.bookId === b.id; });
    var bf = fund.filter(function (f) { return f.bookId === b.id; });
    var bs = sets.filter(function (s) { return s.bookId === b.id; });
    out.summary[b.id] = { fund: computeFundSummary(bf, br),
      contribution: computeContribution(bf, bs, members, b.settings.groupWeights) };
  });
  out.records = recs.filter(function (r) { return canSee_(me, r); })
    .map(function (r) { r.createdByName = names[r.createdBy] || '（已離開）'; return r; });
  out.fund = fund.filter(function (f) { return canSee_(me, f); })
    .map(function (f) { f.createdByName = names[f.createdBy] || '（已離開）'; return f; });
  out.settlements = sets.map(function (s) {
    s.createdByName = names[s.createdBy] || ''; return s; });
  out.recon = readAll_(sheet_('Recon', RECON_COLS), RECON_COLS).filter(function (r) { return !isTrue_(r.deleted); }).map(function (r) {
    return { id: r.id, bookId: r.bookId, date: fmtDate_(r.date), bankBalance: Number(r.bankBalance),
      ledgerBalance: Number(r.ledgerBalance), diff: Number(r.diff), note: r.note, createdByName: names[r.createdBy] || '' };
  });
  return out;
}

function publicRecord_(r) {
  return { id: r.id, bookId: r.bookId, date: fmtDate_(r.date), item: r.item, amount: Number(r.amount) || 0,
    category: r.category, payerId: r.payerId, note: r.note, hasReceipt: !!r.receiptId, status: r.status || '待對帳',
    beneficiary: r.beneficiary || '爸爸', settlementId: r.settlementId || '', hidden: isTrue_(r.hidden),
    createdBy: r.createdBy, createdAt: r.createdAt, updatedAt: r.updatedAt };
}
function publicFund_(f) {
  return { id: f.id, bookId: f.bookId, date: fmtDate_(f.date), type: f.type, source: f.source, sourceDetail: f.sourceDetail,
    account: f.account, amount: Number(f.amount) || 0, memberId: f.memberId || '', note: f.note,
    settlementId: f.settlementId || '', hidden: isTrue_(f.hidden), createdBy: f.createdBy, createdAt: f.createdAt };
}

/* ───────────── 支出紀錄 ───────────── */

function cleanFields_(f) {
  var out = {};
  if (f.date !== undefined) { if (!/^\d{4}-\d{2}-\d{2}$/.test(f.date)) throw err_('INPUT', '日期格式錯誤'); out.date = f.date; }
  if (f.item !== undefined) { out.item = String(f.item).trim().slice(0, 100); if (!out.item) throw err_('INPUT', '請填寫項目'); }
  if (f.amount !== undefined) {
    out.amount = Math.round(Number(f.amount));
    if (!(out.amount > 0) || out.amount > 100000000) throw err_('INPUT', '金額需為正數');
  }
  if (f.category !== undefined) { if (CATEGORIES.indexOf(f.category) < 0) throw err_('INPUT', '類別不正確'); out.category = f.category; }
  if (f.beneficiary !== undefined) { if (BENEFICIARIES.indexOf(f.beneficiary) < 0) throw err_('INPUT', '照護對象不正確'); out.beneficiary = f.beneficiary; }
  if (f.payerId !== undefined) out.payerId = String(f.payerId);
  if (f.note !== undefined) out.note = String(f.note).slice(0, 500);
  return out;
}

function addRecord_(me, req) {
  var b = book_(req.bookId, true);
  var f = cleanFields_(req.record || {});
  ['date', 'item', 'amount', 'category'].forEach(function (k) { if (f[k] === undefined) throw err_('INPUT', '缺少欄位：' + k); });
  if (!f.payerId) f.payerId = me.userId;
  checkPayer_(f.payerId);
  var now = new Date().toISOString();
  var rec = { id: Utilities.getUuid(), bookId: b.id, date: f.date, item: f.item, amount: f.amount, category: f.category,
    payerId: f.payerId, note: f.note || '', receiptId: '', status: '待對帳',
    beneficiary: f.beneficiary || b.settings.defaultBeneficiary || '爸爸', settlementId: '', hidden: false,
    createdBy: me.userId, createdAt: now, updatedAt: now, deleted: false };
  if (req.receipt) rec.receiptId = saveReceipt_(req.receipt, rec);
  withLock_(function () { sheet_('Records', REC_COLS).appendRow(REC_COLS.map(function (c) { return rec[c]; })); });
  log_(me, 'add', rec.id, b.name + '｜' + rec.item + ' $' + rec.amount);
  return publicRecord_(rec);
}

function findOwn_(me, sheetName, cols, id, lockedCheck) {
  var sh = sheet_(sheetName, cols);
  var rows = readAll_(sh, cols);
  for (var i = 0; i < rows.length; i++) {
    if (rows[i].id === id && !isTrue_(rows[i].deleted)) {
      var r = rows[i];
      if (r.createdBy !== me.userId) throw err_('FORBIDDEN', '只能修改自己建立的紀錄');
      book_(r.bookId, true);
      if (lockedCheck) lockedCheck(r);
      return { sh: sh, r: r };
    }
  }
  throw err_('NOT_FOUND', '找不到這筆紀錄');
}
function recLocked_(r) { if (r.status === '已結清' || r.settlementId) throw err_('LOCKED', '已結清的紀錄不能修改，需要更正請管理員撤銷該次結算'); }

function updateRecord_(me, req) {
  return withLock_(function () {
    var x = findOwn_(me, 'Records', REC_COLS, req.id, recLocked_);
    var f = cleanFields_(req.record || {});
    if (f.payerId !== undefined) checkPayer_(f.payerId);
    for (var k in f) x.r[k] = f[k];
    if (req.receipt) x.r.receiptId = saveReceipt_(req.receipt, x.r);
    if (req.removeReceipt) x.r.receiptId = '';
    x.r.updatedAt = new Date().toISOString();
    writeRow_(x.sh, x.r._row, REC_COLS, x.r);
    log_(me, 'update', x.r.id, JSON.stringify(f));
    return publicRecord_(x.r);
  });
}
function removeRecord_(me, req) {
  return withLock_(function () {
    var x = findOwn_(me, 'Records', REC_COLS, req.id, recLocked_);
    x.r.deleted = true; x.r.updatedAt = new Date().toISOString();
    writeRow_(x.sh, x.r._row, REC_COLS, x.r);
    log_(me, 'delete', x.r.id, x.r.item + ' $' + x.r.amount);
    return { id: x.r.id };
  });
}

function checkPayer_(payerId) {
  if (payerId === FUND_ID || payerId === ESTATE_ID) return;
  var ok = members_().some(function (m) { return m.userId === payerId && m.state === 'active'; });
  if (!ok) throw err_('INPUT', '付款人不是有效成員');
}

/* ───────────── 專戶：存入／領取 ───────────── */

function cleanFund_(f) {
  var out = {};
  if (f.date !== undefined) { if (!/^\d{4}-\d{2}-\d{2}$/.test(f.date)) throw err_('INPUT', '日期格式錯誤'); out.date = f.date; }
  if (f.amount !== undefined) {
    out.amount = Math.round(Number(f.amount));
    if (!(out.amount > 0) || out.amount > 1000000000) throw err_('INPUT', '金額需為正數');
  }
  if (f.source !== undefined) { if (FUND_SOURCES.indexOf(f.source) < 0) throw err_('INPUT', '請選擇資金來源'); out.source = f.source; }
  if (f.sourceDetail !== undefined) out.sourceDetail = String(f.sourceDetail).slice(0, 100);
  if (f.account !== undefined) {
    out.account = String(f.account).slice(0, 40);
    if (/\d{7,}/.test(out.account.replace(/[\s-]/g, ''))) throw err_('INPUT', '帳號請只填末 4 碼，不要填完整帳號');
  }
  if (f.memberId !== undefined) out.memberId = String(f.memberId);
  if (f.note !== undefined) out.note = String(f.note).slice(0, 300);
  return out;
}

function fundAdd_(me, req) {
  var b = book_(req.bookId, true);
  var type = req.type === '領取' ? '領取' : '存入';
  var f = cleanFund_(req.entry || {});
  if (f.date === undefined || f.amount === undefined) throw err_('INPUT', '請填日期與金額');
  if (type === '存入') {
    if (!f.source) throw err_('INPUT', '請選擇資金來源');
    if (f.source === '上一本結餘') throw err_('INPUT', '「上一本結餘」由封存帳本時自動產生');
    if (f.source === '家人出資') { if (!f.memberId) f.memberId = me.userId; checkPayer_(f.memberId); }
    else f.memberId = '';
  } else {
    if (!f.memberId) f.memberId = me.userId;
    if (f.memberId !== me.userId && me.role !== 'admin') throw err_('FORBIDDEN', '只能登記自己領取的款項');
    checkPayer_(f.memberId);
    f.source = '';
  }
  var now = new Date().toISOString();
  var e = { id: Utilities.getUuid(), bookId: b.id, date: f.date, type: type, source: f.source, sourceDetail: f.sourceDetail || '',
    account: f.account || '', amount: f.amount, memberId: f.memberId, note: f.note || '', settlementId: '',
    hidden: type === '領取' && !!b.settings.hideReceiveDefault,
    createdBy: me.userId, createdAt: now, updatedAt: now, deleted: false };
  withLock_(function () { sheet_('Fund', FUND_COLS).appendRow(FUND_COLS.map(function (c) { return e[c]; })); });
  log_(me, 'fund_' + type, e.id, b.name + '｜' + (e.source || '領取') + ' $' + e.amount);
  return publicFund_(e);
}
function fundLocked_(r) {
  if (r.type !== '存入' && r.type !== '領取') throw err_('LOCKED', '這筆由結算或封存自動產生，不能手動修改');
  if (r.source === '上一本結餘') throw err_('LOCKED', '這筆由封存帳本自動產生，不能手動修改');
  if (r.settlementId) throw err_('LOCKED', '這筆已納入結算，需要更正請管理員撤銷該次結算');
}
function fundUpdate_(me, req) {
  return withLock_(function () {
    var x = findOwn_(me, 'Fund', FUND_COLS, req.id, fundLocked_);
    var f = cleanFund_(req.entry || {});
    if (x.r.type === '存入' && f.source === '上一本結餘') throw err_('INPUT', '不能選這個來源');
    if (f.memberId !== undefined) checkPayer_(f.memberId);
    for (var k in f) x.r[k] = f[k];
    if (x.r.type === '存入' && x.r.source !== '家人出資') x.r.memberId = '';
    x.r.updatedAt = new Date().toISOString();
    writeRow_(x.sh, x.r._row, FUND_COLS, x.r);
    log_(me, 'fund_update', x.r.id, JSON.stringify(f));
    return publicFund_(x.r);
  });
}
function fundRemove_(me, req) {
  return withLock_(function () {
    var x = findOwn_(me, 'Fund', FUND_COLS, req.id, fundLocked_);
    x.r.deleted = true; x.r.updatedAt = new Date().toISOString();
    writeRow_(x.sh, x.r._row, FUND_COLS, x.r);
    log_(me, 'fund_delete', x.r.id, (x.r.source || x.r.type) + ' $' + x.r.amount);
    return { id: x.r.id };
  });
}

/** 管理員設定某筆支出或專戶紀錄是否公開給其他成員 */
function setHidden_(me, req) {
  requireAdmin_(me);
  var target = req.kind === 'fund' ? ['Fund', FUND_COLS] : ['Records', REC_COLS];
  return withLock_(function () {
    var sh = sheet_(target[0], target[1]);
    var r = readAll_(sh, target[1]).filter(function (x) { return x.id === req.id; })[0];
    if (!r) throw err_('NOT_FOUND', '找不到這筆紀錄');
    r.hidden = !!req.hidden; r.updatedAt = new Date().toISOString();
    writeRow_(sh, r._row, target[1], r);
    log_(me, 'hidden', r.id, String(!!req.hidden));
    return { id: r.id, hidden: !!req.hidden };
  });
}

/* ───────────── 帳本設定、封存 ───────────── */

function writeBook_(b) {
  var sh = sheet_('Books', BOOK_COLS);
  writeRow_(sh, b._row, BOOK_COLS, { id: b.id, name: b.name, kind: b.kind, state: b.state,
    settings: JSON.stringify(b.settings), createdAt: b.createdAt, closedAt: b.closedAt || '' });
}

function bookSettings_(me, req) {
  requireAdmin_(me);
  var b = book_(req.bookId, false), n = req.settings || {}, s = b.settings;
  if (req.name !== undefined) { var nm = String(req.name).trim().slice(0, 30); if (!nm) throw err_('INPUT', '請輸入帳本名稱'); b.name = nm; }
  if (n.mode !== undefined) { if (!SETTLE_MODES[n.mode]) throw err_('INPUT', '結算方式不正確'); s.mode = n.mode; }
  if (n.cap !== undefined) s.cap = Math.max(0, Math.round(Number(n.cap) || 0));
  if (n.lowBalance !== undefined) s.lowBalance = Math.max(0, Math.round(Number(n.lowBalance) || 0));
  if (n.fundName !== undefined) { var fn = String(n.fundName).trim().slice(0, 40); if (fn) s.fundName = fn; }
  if (n.defaultBeneficiary !== undefined && BENEFICIARIES.indexOf(n.defaultBeneficiary) >= 0) s.defaultBeneficiary = n.defaultBeneficiary;
  if (n.hideReceiveDefault !== undefined) s.hideReceiveDefault = !!n.hideReceiveDefault;
  if (n.groupWeights !== undefined) {
    var gw = {};
    Object.keys(n.groupWeights).forEach(function (g) {
      var k = String(g).trim().slice(0, 20), w = Number(n.groupWeights[g]);
      if (k && w >= 0 && w <= 100) gw[k] = w;
    });
    s.groupWeights = gw;
  }
  withLock_(function () { writeBook_(b); });
  log_(me, 'book_settings', b.id, JSON.stringify(s));
  return { id: b.id };
}

function closeBook_(me, req) {
  requireAdmin_(me);
  return withLock_(function () {
    var b = book_(req.bookId, true);
    var recs = records_().filter(function (r) { return r.bookId === b.id; });
    var fund = fund_().filter(function (f) { return f.bookId === b.id; });
    var openRecs = recs.filter(function (r) { return r.status !== '已結清'; }).length;
    var openRecv = fund.filter(function (f) { return f.type === '領取' && !f.settlementId; }).length;
    if (openRecs || openRecv) throw err_('INPUT', '還有 ' + (openRecs + openRecv) + ' 筆未結算，請先完成結算再封存');
    var bal = computeFundSummary(fund.map(publicFund_), recs.map(publicRecord_)).balance;
    var now = new Date().toISOString(), today = fmtDate_(new Date());
    if (bal > 0 && req.transferTo) {
      var t = book_(req.transferTo, true);
      if (t.id === b.id) throw err_('INPUT', '不能轉給自己');
      var fsh = sheet_('Fund', FUND_COLS);
      var mk = function (bookId, type, source, note) {
        return { id: Utilities.getUuid(), bookId: bookId, date: today, type: type, source: source, sourceDetail: '',
          account: '', amount: bal, memberId: '', note: note, settlementId: '', hidden: false,
          createdBy: me.userId, createdAt: now, updatedAt: now, deleted: false };
      };
      fsh.appendRow(FUND_COLS.map(function (c) { return mk(b.id, '轉出', '', '封存，結餘轉入「' + t.name + '」')[c]; }));
      fsh.appendRow(FUND_COLS.map(function (c) { return mk(t.id, '存入', '上一本結餘', '來自「' + b.name + '」結餘')[c]; }));
    }
    b.state = 'closed'; b.closedAt = now; writeBook_(b);
    log_(me, 'close_book', b.id, '結餘 ' + bal + (req.transferTo ? ' → ' + req.transferTo : ''));
    return { balance: bal, transferred: bal > 0 && !!req.transferTo };
  });
}
function reopenBook_(me, req) {
  requireAdmin_(me);
  return withLock_(function () {
    var b = book_(req.bookId, false);
    b.state = 'open'; b.closedAt = ''; writeBook_(b);
    log_(me, 'reopen_book', b.id, '');
    return { ok: true };
  });
}

/* ───────────── 結算 ───────────── */

function settlementInput_(b, cutoff) {
  var recs = records_().map(publicRecord_).filter(function (r) { return r.bookId === b.id; });
  var fund = fund_().map(publicFund_).filter(function (f) { return f.bookId === b.id; });
  var fs = computeFundSummary(fund, recs);
  return {
    records: recs.filter(function (r) { return r.status !== '已結清' && r.date <= cutoff; }),
    receipts: fund.filter(function (f) { return f.type === '領取' && !f.settlementId && f.date <= cutoff; }),
    members: members_().filter(function (m) { return m.state === 'active'; }),
    groupWeights: b.settings.groupWeights || {}, mode: b.settings.mode, cap: b.settings.cap, fundAvailable: fs.balance
  };
}
function checkCutoff_(c) { if (!/^\d{4}-\d{2}-\d{2}$/.test(String(c || ''))) throw err_('INPUT', '請選擇結算截止日'); return String(c); }

function preview_(me, req) {
  var b = book_(req.bookId, false);
  return computeSettlement(settlementInput_(b, checkCutoff_(req.cutoff)));
}

function settle_(me, req) {
  requireAdmin_(me);
  var cutoff = checkCutoff_(req.cutoff);
  return withLock_(function () {
    var b = book_(req.bookId, true);
    var c = computeSettlement(settlementInput_(b, cutoff));
    if (!c.includedIds.length && !c.receiptIds.length) throw err_('INPUT', '沒有可結算的紀錄');
    if (c.blocked) throw err_('BLOCKED', c.warnings.join('；'));
    if (req.expectTotal !== undefined && Math.round(req.expectTotal) !== Math.round(c.total)) {
      throw err_('STALE', '資料剛有變動，請重新整理後再結算');
    }
    var now = new Date().toISOString(), today = fmtDate_(new Date()), sid = Utilities.getUuid();
    var label = String(req.label || '').slice(0, 30) || (cutoff.slice(0, 7).replace('-', '年') + '月');
    var fsh = sheet_('Fund', FUND_COLS);
    var entry = function (type, x, note) {
      var e = { id: Utilities.getUuid(), bookId: b.id, date: today, type: type, source: '', sourceDetail: '', account: '',
        amount: x.amount, memberId: x.id, note: label + ' ' + note, settlementId: sid, hidden: false,
        createdBy: me.userId, createdAt: now, updatedAt: now, deleted: false };
      fsh.appendRow(FUND_COLS.map(function (k) { return e[k]; }));
    };
    c.returns.forEach(function (x) { entry('退回', x, '結算：領取多於墊付，退回專戶'); });
    c.reimburse.forEach(function (x) { entry('撥付', x, '結算撥還'); });
    var recIds = {}; c.receiptIds.forEach(function (id) { recIds[id] = true; });
    readAll_(fsh, FUND_COLS).forEach(function (f) {
      if (recIds[f.id]) { f.settlementId = sid; f.updatedAt = now; writeRow_(fsh, f._row, FUND_COLS, f); }
    });
    var inc = {}; c.includedIds.forEach(function (id) { inc[id] = true; });
    var rsh = sheet_('Records', REC_COLS);
    readAll_(rsh, REC_COLS).forEach(function (r) {
      if (inc[r.id]) { r.status = '已結清'; r.settlementId = sid; r.updatedAt = now; writeRow_(rsh, r._row, REC_COLS, r); }
    });
    var row = { id: sid, bookId: b.id, label: label, cutoff: cutoff, mode: c.mode, total: c.total, fundTotal: c.fundTotal,
      familyShare: c.familyShare, recordCount: c.includedIds.length,
      detail: JSON.stringify({ reimburse: c.reimburse, returns: c.returns, transfers: c.transfers,
        groupRows: c.groupRows, estateClaims: c.estateClaims }),
      state: '有效', createdBy: me.userId, createdAt: now };
    sheet_('Settlements', SET_COLS).appendRow(SET_COLS.map(function (k) { return row[k]; }));
    log_(me, 'settle', sid, b.name + '｜' + label + ' ' + c.modeName + ' $' + c.total);
    return { id: sid, result: c };
  });
}

function undoSettle_(me, req) {
  requireAdmin_(me);
  return withLock_(function () {
    var ssh = sheet_('Settlements', SET_COLS);
    var all = readAll_(ssh, SET_COLS).filter(function (s) { return s.state === '有效' && s.bookId === req.bookId; });
    var last = all[all.length - 1];
    if (!last || last.id !== req.id) throw err_('INPUT', '只能撤銷這本帳最近一次的結算');
    book_(last.bookId, true);
    var now = new Date().toISOString();
    var fsh = sheet_('Fund', FUND_COLS);
    readAll_(fsh, FUND_COLS).forEach(function (f) {
      if (f.settlementId !== last.id || isTrue_(f.deleted)) return;
      if (f.type === '撥付' || f.type === '退回') f.deleted = true; else f.settlementId = '';
      f.updatedAt = now; writeRow_(fsh, f._row, FUND_COLS, f);
    });
    var rsh = sheet_('Records', REC_COLS);
    readAll_(rsh, REC_COLS).forEach(function (r) {
      if (r.settlementId === last.id) { r.status = '待對帳'; r.settlementId = ''; r.updatedAt = now; writeRow_(rsh, r._row, REC_COLS, r); }
    });
    last.state = '已撤銷'; writeRow_(ssh, last._row, SET_COLS, last);
    log_(me, 'undo_settle', last.id, last.label);
    return { ok: true };
  });
}

/* ───────────── 銀行對帳 ───────────── */

function recon_(me, req) {
  requireAdmin_(me);
  var b = book_(req.bookId, false);
  var date = checkCutoff_(req.date);
  var bank = Math.round(Number(req.bankBalance));
  if (!(bank >= 0)) throw err_('INPUT', '請輸入銀行實際餘額');
  var recs = records_().map(publicRecord_).filter(function (r) { return r.bookId === b.id; });
  var fund = fund_().map(publicFund_).filter(function (f) { return f.bookId === b.id; });
  var ledger = computeFundSummary(fund, recs).balance;
  var row = { id: Utilities.getUuid(), bookId: b.id, date: date, bankBalance: bank, ledgerBalance: ledger,
    diff: bank - ledger, note: String(req.note || '').slice(0, 200), createdBy: me.userId, createdAt: new Date().toISOString(), deleted: false };
  withLock_(function () { sheet_('Recon', RECON_COLS).appendRow(RECON_COLS.map(function (k) { return row[k]; })); });
  log_(me, 'recon', row.id, b.name + ' 銀行 ' + bank + ' 帳本 ' + ledger);
  return row;
}

function reconRemove_(me, req) {
  requireAdmin_(me);
  return withLock_(function () {
    var sh = sheet_('Recon', RECON_COLS), all = readAll_(sh, RECON_COLS), r = null;
    all.forEach(function (x) { if (x.id === req.id) r = x; });
    if (!r || isTrue_(r.deleted)) throw err_('NOT_FOUND', '找不到這筆對帳紀錄');
    r.deleted = true;
    writeRow_(sh, r._row, RECON_COLS, r);
    log_(me, 'recon_delete', r.id, '銀行 ' + r.bankBalance + ' 帳本 ' + r.ledgerBalance);
    return { id: r.id };
  });
}

/* ───────────── 成員 ───────────── */

function renameSelf_(me, req) {
  var name = String(req.name || '').trim().slice(0, 20);
  if (!name) throw err_('INPUT', '請輸入名稱');
  me.name = name; me.nameSet = true;
  writeRow_(sheet_('Members', MEM_COLS), me._row, MEM_COLS, me);
  log_(me, 'rename', '', name);
  return { name: name };
}

function adminMember_(me, req) {
  requireAdmin_(me);
  var sh = sheet_('Members', MEM_COLS);
  var m = readAll_(sh, MEM_COLS).filter(function (r) { return r.userId === req.userId; })[0];
  if (!m) throw err_('NOT_FOUND', '找不到成員');
  if (m.userId === me.userId && (req.op === 'remove' || req.op === 'role')) throw err_('INPUT', '不能移除自己或改自己的權限');
  switch (req.op) {
    case 'approve': m.state = 'active'; if (ROLES.indexOf(req.value) >= 0 && req.value !== 'admin') m.role = req.value; break;
    case 'remove': m.state = 'removed'; break;
    case 'role': if (ROLES.indexOf(req.value) < 0) throw err_('INPUT', '權限不正確'); m.role = req.value; break;
    case 'group': m.group = String(req.value || '').trim().slice(0, 20); break;
    case 'rename':
      var nm = String(req.value || '').trim().slice(0, 20);
      if (!nm) throw err_('INPUT', '請輸入名稱'); m.name = nm; m.nameSet = true; break;
    default: throw err_('INPUT', '未知操作');
  }
  writeRow_(sh, m._row, MEM_COLS, m);
  log_(me, 'member_' + req.op, m.userId, m.name + (req.value !== undefined ? ' ' + req.value : ''));
  return { ok: true };
}

/* ───────────── 合併計算（家庭）：多位成員合成一個分攤單位 ───────────── */

function groupSave_(me, req) {
  requireAdmin_(me);
  var name = String(req.name || '').trim().slice(0, 20);
  if (!name) throw err_('INPUT', '請輸入合併計算的名稱');
  var oldName = String(req.oldName || '').trim();
  var ids = {}; (req.userIds || []).forEach(function (u) { ids[u] = true; });
  if (!Object.keys(ids).length) throw err_('INPUT', '請至少勾選一位成員');
  return withLock_(function () {
    var sh = sheet_('Members', MEM_COLS), rows = readAll_(sh, MEM_COLS);
    if (oldName !== name && rows.some(function (m) { return m.group === name && !ids[m.userId] && m.group !== oldName; })) {
      throw err_('INPUT', '已經有「' + name + '」，請換一個名稱或直接編輯它');
    }
    var found = 0;
    rows.forEach(function (m) {
      var was = m.group, next = was;
      if (ids[m.userId]) { next = name; found++; }
      else if (was === name || (oldName && was === oldName)) next = '';
      if (next !== was) { m.group = next; writeRow_(sh, m._row, MEM_COLS, m); }
    });
    if (found !== Object.keys(ids).length) throw err_('INPUT', '有成員不存在');
    books_().forEach(function (b) {
      var gw = b.settings.groupWeights || {}, w = gw[name];
      if (oldName && oldName !== name && gw[oldName] !== undefined) { if (w === undefined) w = gw[oldName]; delete gw[oldName]; }
      if (req.weights && req.weights[b.id] !== undefined) {
        var v = Number(req.weights[b.id]);
        if (!(v >= 0) || v > 100) throw err_('INPUT', '比例需介於 0 到 100');
        w = v;
      }
      if (w !== undefined) gw[name] = w;
      b.settings.groupWeights = gw; writeBook_(b);
    });
    log_(me, 'group_save', '', (oldName && oldName !== name ? oldName + '→' : '') + name + '：' + Object.keys(ids).length + ' 人');
    return { name: name };
  });
}

function groupDelete_(me, req) {
  requireAdmin_(me);
  var name = String(req.name || '').trim();
  if (!name) throw err_('INPUT', '缺少名稱');
  return withLock_(function () {
    var sh = sheet_('Members', MEM_COLS);
    readAll_(sh, MEM_COLS).forEach(function (m) { if (m.group === name) { m.group = ''; writeRow_(sh, m._row, MEM_COLS, m); } });
    books_().forEach(function (b) {
      var gw = b.settings.groupWeights || {};
      if (gw[name] !== undefined) { delete gw[name]; b.settings.groupWeights = gw; writeBook_(b); }
    });
    log_(me, 'group_delete', '', name);
    return { ok: true };
  });
}

function requireAdmin_(me) { if (me.role !== 'admin') throw err_('FORBIDDEN', '只有管理員可以執行'); }

/* ───────────── 收據（存於擁有者雲端硬碟，不公開） ───────────── */

function saveReceipt_(dataUrl, rec) {
  var m = /^data:(image\/(?:jpeg|png|webp));base64,(.+)$/.exec(dataUrl);
  if (!m) throw err_('INPUT', '收據格式需為圖片');
  var bytes = Utilities.base64Decode(m[2]);
  if (bytes.length > 4 * 1024 * 1024) throw err_('INPUT', '圖片太大');
  var blob = Utilities.newBlob(bytes, m[1], rec.date + '_' + rec.item + '_' + rec.id.slice(0, 8));
  return receiptFolder_().createFile(blob).getId();
}
function getReceipt_(me, req) {
  var r = records_().filter(function (x) { return x.id === req.id; })[0];
  if (!r || !r.receiptId || !canSee_(me, r)) throw err_('NOT_FOUND', '沒有收據');
  var blob = DriveApp.getFileById(r.receiptId).getBlob();
  return { dataUrl: 'data:' + blob.getContentType() + ';base64,' + Utilities.base64Encode(blob.getBytes()) };
}
function receiptFolder_() {
  var id = prop_('RECEIPT_FOLDER_ID');
  if (id) { try { return DriveApp.getFolderById(id); } catch (e) {} }
  var f = DriveApp.createFolder('爸媽照護帳本_收據');
  PropertiesService.getScriptProperties().setProperty('RECEIPT_FOLDER_ID', f.getId());
  return f;
}

/* ───────────── 試算表工具 ───────────── */

function ss_() { var id = prop_('SHEET_ID'); return id ? SpreadsheetApp.openById(id) : SpreadsheetApp.getActiveSpreadsheet(); }

var SS_ = null, SHEETS_ = {};   // 同一次請求內只開一次試算表、每張工作表只查一次
function sheet_(name, cols) {
  if (SHEETS_[name]) return SHEETS_[name];
  var ss = SS_ || (SS_ = ss_()), sh = ss.getSheetByName(name);
  if (!sh) {
    sh = ss.insertSheet(name);
    sh.getRange(1, 1, 1, cols.length).setValues([cols]).setFontWeight('bold');
    sh.setFrozenRows(1);
    ['date', 'cutoff'].forEach(function (c) {   // 日期以文字存，避免時區偏移
      var i = cols.indexOf(c);
      if (i >= 0) sh.getRange(1, i + 1, sh.getMaxRows(), 1).setNumberFormat('@');
    });
  }
  SHEETS_[name] = sh;
  return sh;
}
var MEMO_ = {};   // 同一次請求內重複讀同一張表時重用結果（寫入後自動失效）
function readAll_(sh, cols) {
  var last = sh.getLastRow(), n = last - 1;
  if (n < 1) return [];
  var key = (sh.getName ? sh.getName() : '') + '|' + last + '|' + cols.length;
  var raw = MEMO_[key];
  if (!raw) raw = MEMO_[key] = sh.getRange(2, 1, n, cols.length).getValues();
  return raw.map(function (row, i) {
    var o = { _row: i + 2 }; cols.forEach(function (c, j) { o[c] = row[j]; }); return o;
  });
}
function writeRow_(sh, rowNum, cols, obj) {
  MEMO_ = {};
  sh.getRange(rowNum, 1, 1, cols.length).setValues([cols.map(function (c) { return obj[c] === undefined ? '' : obj[c]; })]);
}
function withLock_(fn) {
  var lock = LockService.getScriptLock(); lock.waitLock(15000);
  try { return fn(); } finally { lock.releaseLock(); }
}
function log_(me, action, refId, detail) {
  try { sheet_('Log', LOG_COLS).appendRow([new Date().toISOString(), me.userId, me.name, action, refId, detail]); } catch (e) {}
}
function fmtDate_(d) {
  if (d instanceof Date) return Utilities.formatDate(d, 'Asia/Taipei', 'yyyy-MM-dd');
  return String(d || '');
}
function prop_(k) { return PropertiesService.getScriptProperties().getProperty(k); }
function err_(code, msg) { var e = new Error(msg); e.code = code; return e; }
function json_(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }

/** 第一次部署前手動執行一次：建立工作表、兩本預設帳本，並完成授權 */

function importFromNotion() {
  var props = PropertiesService.getScriptProperties();

      createdBy: admin.userId, createdAt: now, updatedAt: now, deleted: false

  sh.getRange(sh.getLastRow() + 1, 1, out.length, REC_COLS.length).setValues(out);

  Logger.log('已匯入 ' + out.length + ' 筆');
}
